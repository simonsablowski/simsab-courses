name = "simsab-courses"
compatibility_date = "2026-09-23"
pages_build_output_dir = "public"

# KV namespace used to cache course product listings from Stripe.
# Create it with:
#   npx wrangler kv namespace create COURSES_CACHE
# then paste the id it prints into the line below.
[[kv_namespaces]]
binding = "COURSES_CACHE"
id = "e6366548ba3c4f2cbd31970981a5a90b"

# Secrets (set these with `npx wrangler pages secret put NAME`, not here):
#   STRIPE_SECRET_KEY
#   STRIPE_WEBHOOK_SECRET
